<script src="/assets/js/lib.js"></script><script>
(function(){
  var L = window.MinimsaahLib;
  if (!L) {
    try {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    } catch (e) {}
    return;
  }
  var getSlug = L.getSlug, normRow = L.normRow, useSupabase = L.useSupabase;
  async function loadSupabase(slug){
    // Note: events table has no view_count column, so no view counter here.
    return L.loadOne({ table: 'events' });
  }
  async function load(){
    var slug=getSlug();
    if(!slug){document.getElementById('loading').classList.add('hidden');document.getElementById('error').classList.remove('hidden');return;}
    try{
      var e = await loadSupabase(slug);
      document.title=e.title+' | MINIMSAAH';
      document.getElementById('bc-title').textContent=e.title;
      document.getElementById('title').textContent=e.title;
      var d=new Date(e.date);
      document.getElementById('day').textContent=d.getDate();
      document.getElementById('month').textContent=d.toLocaleDateString('en-US',{month:'short'}).toUpperCase();
      document.getElementById('meta').textContent=(e.location||e.venue||'')+' • '+d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+(e.endDate? ' — '+new Date(e.endDate).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'');
      if(e.coverImage){document.getElementById('cover-wrap').classList.remove('hidden');document.getElementById('cover').src=e.coverImage;}
      document.getElementById('desc').textContent=e.description||'';
      if(e.ticketUrl && /^https:\/\//i.test(e.ticketUrl)){var t=document.getElementById('ticket');t.classList.remove('hidden');t.href=e.ticketUrl;}
      L.renderTags(e.tags);
      L.setPageState('content');
    }catch(err){L.setPageState('error');}
  }
  load();
})();
</script>
