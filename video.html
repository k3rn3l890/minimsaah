<script>
// drawer for video detail
(function(){ var t=document.getElementById('menu-toggle-detail'), d=document.getElementById('mobile-drawer-detail'), c=document.getElementById('menu-close-detail'); if(!t||!d) return; function open(){ d.classList.remove('hidden'); requestAnimationFrame(function(){ d.classList.remove('opacity-0'); }); document.body.style.overflow='hidden'; } function close(){ d.classList.add('opacity-0'); setTimeout(function(){ d.classList.add('hidden'); document.body.style.overflow=''; },200);} t.onclick=open; if(c) c.onclick=close; d.onclick=function(e){ if(e.target===d) close(); };})();
</script>
<script>
(function(){
  var API=location.hostname==='localhost'||location.hostname==='127.0.0.1' ? 'http://localhost:3000/api/v1' : (window.__API_BASE__||'http://localhost:3000/api/v1');
  function getSlug(){return new URLSearchParams(location.search).get('slug');}
  function fmt(d){try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch{return d;}}
  var current=null;
  function loadPlayer(v){
    var wrap=document.getElementById('player');
    var thumbO=document.getElementById('thumb-overlay');
    // thumbnail
    var t= (window.MinimsaahEmbeds? window.MinimsaahEmbeds.thumbnailUrl(v): (v.thumbnail||'')) || '';
    if(t) document.getElementById('thumb').src=t;
    function play(){
      var embed = window.MinimsaahEmbeds? window.MinimsaahEmbeds.toEmbedUrl(v.videoUrl, v.embedUrl): (v.embedUrl||v.videoUrl);
      var provider= window.MinimsaahEmbeds? window.MinimsaahEmbeds.detectProvider(v.videoUrl):'unknown';
      var iframe= window.MinimsaahEmbeds? window.MinimsaahEmbeds.createIframe(embed, provider): (function(){var f=document.createElement('iframe');f.src=embed;f.style.width='100%';f.style.height='100%';f.setAttribute('allowfullscreen','true');f.setAttribute('allow','autoplay; fullscreen; encrypted-media');return f;})();
      wrap.innerHTML=''; wrap.appendChild(iframe);
      thumbO.style.display='none';
      // TikTok needs taller wrap — cap to viewport on phone
      if(provider==='tiktok'){ var pw=document.getElementById('player-wrap'); pw.style.aspectRatio='9/16'; pw.style.maxWidth='min(420px, 90vw)'; pw.style.margin='0 auto'; }
    }
    thumbO.onclick=play;
    // auto-play if ?autoplay=1
    if(new URLSearchParams(location.search).get('autoplay')==='1') play();
  }
  async function load(){
    var slug=getSlug();
    if(!slug){document.getElementById('loading').classList.add('hidden');document.getElementById('error').classList.remove('hidden');return;}
    try{
      var res=await fetch(API+'/videos/'+encodeURIComponent(slug));
      if(!res.ok) throw new Error('not found');
      var v=await res.json(); current=v;
      document.title=v.title+' | MINIMSAAH';
      document.getElementById('bc-title').textContent=v.title;
      document.getElementById('cat').textContent=(v.category||'High­light').replace(/_/g,' ');
      if(v.duration){ var m=Math.floor(v.duration/60), s=v.duration%60; document.getElementById('dur').textContent=m+':'+String(s).padStart(2,'0'); }
      document.getElementById('views').textContent=(v.viewCount||0)+' views';
      document.getElementById('title').textContent=v.title;
      document.getElementById('desc').textContent=v.description||'';
      if(!v.description) document.getElementById('desc').style.display='none';
      document.getElementById('author').textContent='By '+(v.author? (v.author.firstName+' '+v.author.lastName):'MINIMSAAH');
      document.getElementById('date').textContent=fmt(v.publishedAt||v.createdAt);
      var tg=document.getElementById('tags'); (v.tags||[]).forEach(function(t){var s=document.createElement('span');s.className='text-[10px] font-mono tracking-widest border border-white/10 px-2 py-1 text-gray-500 uppercase';s.textContent='#'+t;tg.appendChild(s);});
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      document.getElementById('share-copy').onclick=function(){navigator.clipboard.writeText(location.href);this.textContent='✓';setTimeout(()=>this.innerHTML='<iconify-icon icon="solar:link-linear" width="14"></iconify-icon>',1200);};
      loadPlayer(v);
      loadRelated(v.category, v.id);
    }catch(e){document.getElementById('loading').classList.add('hidden');document.getElementById('error').classList.remove('hidden');}
  }
  async function loadRelated(cat, excludeId){
    try{
      var q=cat? '?category='+encodeURIComponent(cat)+'&limit=3&status=PUBLISHED':'?limit=3&status=PUBLISHED';
      var res=await fetch(API+'/videos'+q);
      if(!res.ok) return;
      var data=await res.json();
      var items=(data.items||data).filter(function(x){return x.id!==excludeId;}).slice(0,3);
      if(!items.length) return;
      var grid=document.getElementById('related-grid');
      items.forEach(function(it){
        var t= window.MinimsaahEmbeds? window.MinimsaahEmbeds.thumbnailUrl(it): (it.thumbnail||'');
        var a=document.createElement('a');
        a.href='video.html?slug='+encodeURIComponent(it.slug);
        a.className='group block rounded-sm overflow-hidden border border-white/5 bg-[#0A0A0A]';
        a.innerHTML='<div class="aspect-[16/9] overflow-hidden bg-[#111] relative">'+(t? '<img src="'+t+'" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">':'')+'<div class="absolute inset-0 flex items-center justify-center"><div class="w-10 h-10 rounded-full bg-[#E63946]/90 flex items-center justify-center"><svg class="w-5 h-5 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div></div><div class="p-3"><h3 class="text-sm font-medium line-clamp-2 group-hover:text-[#E63946]">'+it.title+'</h3><span class="text-[11px] font-mono text-gray-600">'+fmt(it.publishedAt||it.createdAt)+'</span></div>';
        grid.appendChild(a);
      });
      document.getElementById('related').classList.remove('hidden');
    }catch{}
  }
  load();
})();
</script>
