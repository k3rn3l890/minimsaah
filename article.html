<script>
(function(){
  var L = window.MinimsaahLib;
  if (!L) {
    try {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    } catch (e) {}
    return;
  }
  var esc = L.esc, normRow = L.normRow, fmt = L.fmtDate, useSupabase = L.useSupabase;
  var getSlug = L.getSlug;
  function loadSupabase(slug){
    return L.loadOne({ table: 'articles', select: '*,author:users(first_name,last_name,bio)', withAuthor: true, view: 'articles' });
  }
  async function load(){
    var slug=getSlug();
    if(!slug){ document.getElementById('loading').classList.add('hidden'); document.getElementById('error').classList.remove('hidden'); return; }
    try{
      var a = await loadSupabase(slug);
      document.title=a.title+' | MINIMSAAH';
      document.getElementById('bc-title').textContent=a.title;
      document.getElementById('cat').textContent=(a.category||'Feature').replace(/_/g,' ');
      document.getElementById('date').textContent=fmt(a.publishedAt||a.createdAt);
      document.getElementById('title').textContent=a.title;
      document.getElementById('excerpt').textContent=a.excerpt||'';
      if(!a.excerpt) document.getElementById('excerpt').style.display='none';
      document.getElementById('author').textContent='By '+(a.author? (a.author.firstName+' '+a.author.lastName):'MINIMSAAH');
      document.getElementById('reading').textContent=(a.readingTime||5)+' min read';
      document.getElementById('views').textContent=(a.viewCount||0)+' views';
      if(a.coverImage){ var w=document.getElementById('cover-wrap'); w.classList.remove('hidden'); document.getElementById('cover').src=a.coverImage; document.getElementById('cover').alt=a.title; }
      // body: split paragraphs
      var body=document.getElementById('body');
      var html=(a.body||'').split('\n').map(function(p){ p=p.trim(); return p? '<p>'+esc(p)+'</p>':''; }).join('');
      body.innerHTML=html || '<p class="text-gray-500">No content.</p>';
      // tags
      L.renderTags(a.tags);
      L.setPageState('content');
      // share
      L.bindShareCopy();
      document.getElementById('share-x').onclick=function(){ window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(a.title)+'&url='+encodeURIComponent(location.href),'_blank'); };
      // related
      loadRelated(a.category, a.id);
    }catch(e){
      L.setPageState('error');
    }
  }
  async function loadRelated(cat, excludeId){
    try{
      var items=[];
      if (useSupabase()) {
        var sb = window.SupabaseDB.client();
        var q = sb.from('articles').select('*').eq('status','PUBLISHED').order('published_at',{ascending:false}).limit(4);
        if (cat) q = q.eq('category', cat);
        var r = await q;
        if (r.error) return;
        items=(r.data||[]).map(normRow).filter(function(x){ return x.id!==excludeId; }).slice(0,3);
      } else {
        var qs=cat? '?category='+encodeURIComponent(cat)+'&limit=3&status=PUBLISHED':'?limit=3&status=PUBLISHED';
        var res=await fetch(L.apiBase()+'/articles'+qs);
        if(!res.ok) return;
        var data=await res.json();
        items=(data.items||data).filter(function(x){ return x.id!==excludeId; }).slice(0,3);
      }
      if(!items.length) return;
      var grid=document.getElementById('related-grid');
      items.forEach(function(it){
        var a=document.createElement('a');
        a.href='/article.html?slug='+encodeURIComponent(it.slug);
        a.className='group block rounded-sm overflow-hidden border border-white/5 bg-[#0A0A0A]';
        a.innerHTML='<div class="aspect-[16/9] overflow-hidden bg-[#111]">'+(it.coverImage? '<img src="'+esc(it.coverImage)+'" alt="'+esc(it.title)+'" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">':'')+'</div><div class="p-4"><span class="text-[10px] font-mono tracking-widest text-[#E63946] uppercase">'+esc((it.category||'').replace(/_/g,' '))+'</span><h3 class="font-[Space_Grotesk,sans-serif] text-sm font-medium mt-1 group-hover:text-[#E63946] line-clamp-2">'+esc(it.title)+'</h3><span class="text-[11px] font-mono text-gray-600 mt-1 block">'+fmt(it.publishedAt||it.createdAt)+'</span></div>';
        grid.appendChild(a);
      });
      document.getElementById('related').classList.remove('hidden');
    }catch{}
  }
  load();
})();
</script>
