name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit
      - run: node --check scripts/inject-env.js
      - run: node --check scripts/sitemap.js
      - run: node --check scripts/audit-secrets.cjs
      - run: node --check api/log-event.js
