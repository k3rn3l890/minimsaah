name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: node scripts/build-head.js --check
      - run: npm test
      - run: npm run audit
      - run: npm run verify
      - run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"
      - run: node -e "const {execSync}=require('child_process'); const out=execSync('git grep -l cdn.tailwindcss.com -- *.html admin/*.html || true',{encoding:'utf8'}).trim(); if(out){console.error('CDN still referenced in HTML:\n'+out); process.exit(1)} console.log('tailwind CDN gone from HTML')"
      - run: node --check tailwind.config.js
      - run: node --check scripts/build-head.js
      - run: node --check scripts/backup-restore.js
      - run: node --check scripts/inject-env.js
      - run: node --check scripts/sitemap.js
      - run: node --check scripts/audit-secrets.cjs
      - run: node --check api/log-event.js
      - run: node --check api/view.js
      - run: node --check api/upload-approve.js
      - run: node --check api/admin/delete.js
      - run: node --check assets/js/lib.js
      - run: node --check assets/js/player.js
      - run: node --check assets/js/app.js
      - run: node --check assets/js/contact.js
      - run: node --check assets/js/embeds.js
      - run: node --check admin/js/admin.js
