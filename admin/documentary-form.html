<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentary Form — MINIMSAAH Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*:focus-visible{outline:2px solid #E63946;outline-offset:2px}</style>
</head>
<body class="bg-[#050505] text-white font-['Inter',sans-serif] min-h-screen">
<nav class="sticky top-0 z-40 bg-[#050505]/90 backdrop-blur-md border-b border-white/5 px-4 md:px-6 py-3 flex items-center justify-between">
  <a href="index.html" class="font-['Space_Grotesk',sans-serif] text-lg tracking-[0.2em] uppercase">MINIMSAAH</a>
  <div class="flex gap-2"><a href="documentaries.html" class="text-xs font-mono border border-white/10 px-3 py-1.5">← Docs</a><button onclick="Admin.logout()" class="text-[11px] font-mono border border-white/10 px-3 py-1.5 uppercase">Logout</button></div>
</nav>
<main class="max-w-[800px] mx-auto p-4 md:p-6">
  <h1 id="heading" class="font-['Space_Grotesk',sans-serif] text-xl md:text-2xl font-medium tracking-tight mb-1">New Documentary</h1>
  <p class="text-xs font-mono text-gray-500 mb-4">Long-form video — also supports YouTube/TikTok/Facebook/Instagram link.</p>
  <form id="form" class="space-y-4 bg-[#0A0A0A] border border-white/5 rounded-sm p-4 md:p-6">
    <div><label class="text-[11px] font-mono tracking-widest uppercase text-gray-400">Title *</label><input id="title" required class="w-full mt-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm"></div>
    <div><label class="text-[11px] font-mono tracking-widest uppercase text-gray-400">Slug (auto)</label><input id="slug" placeholder="auto" class="w-full mt-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm"></div>
    <div><label class="text-[11px] font-mono tracking-widest uppercase text-gray-400">Description</label><textarea id="description" rows="3" class="w-full mt-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm"></textarea></div>
    <div><label class="text-[11px] font-mono tracking-widest uppercase text-gray-400">Video Link (YouTube/TikTok/Facebook/Instagram)</label><input id="videoUrl" placeholder="https://..." class="w-full mt-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm"></div>
    <div>
      <label class="text-[11px] font-mono tracking-widest uppercase text-gray-400">Cover Image (upload stays on your computer)</label>
      <div class="flex gap-2 mt-1"><input id="coverImage" placeholder="auto or /uploads/xxx.jpg" class="flex-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm"><label class="bg-white/5 border border-white/10 px-4 py-2.5 text-xs font-mono tracking-widest uppercase cursor-pointer">Upload<input id="file" type="file" accept="image/*" class="hidden"></label></div>
      <div id="cover-preview" class="hidden mt-2"><img id="cover-img" src="" class="w-full max-h-52 object-cover rounded-sm border border-white/10"></div>
    </div>
    <div class="grid md:grid-cols-3 gap-3">
      <div><label class="text-[11px] font-mono tracking-widest uppercase text-gray-400">Duration (sec)</label><input id="duration" type="number" class="w-full mt-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm"></div>
      <div><label class="text-[11px] font-mono tracking-widest uppercase text-gray-400">Status</label><select id="status" class="w-full mt-1 bg-[#0A0A0A] border border-white/10 rounded-sm px-3 py-2.5 text-sm"><option value="DRAFT">Draft</option><option value="PUBLISHED">Published</option></select></div>
      <div class="flex items-center gap-2 mt-5"><input id="featured" type="checkbox" class="w-4 h-4 accent-[#E63946]"><label for="featured" class="text-xs font-mono tracking-widest uppercase">Featured</label></div>
    </div>
    <div><label class="text-[11px] font-mono tracking-widest uppercase text-gray-400">Tags</label><input id="tags" placeholder="documentary, ghana" class="w-full mt-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm"></div>
    <div class="flex gap-2 pt-2"><button type="submit" id="btn" class="flex-1 bg-[#E63946] hover:bg-[#c53030] text-white text-xs font-mono tracking-widest uppercase py-3 rounded-sm">Save Documentary</button><a href="documentaries.html" class="px-6 py-3 border border-white/10 text-xs font-mono tracking-widest uppercase rounded-sm">Cancel</a></div>
    <p id="err" class="hidden text-xs text-[#E63946] bg-[#E63946]/10 border border-[#E63946]/20 rounded-sm px-3 py-2"></p><p id="ok" class="hidden text-xs text-green-400 bg-green-900/20 border border-green-800 rounded-sm px-3 py-2"></p>
  </form>
</main>
<script src="js/admin.js"></script>
<script>
(function(){
  Admin.requireAuth();
  var id=new URLSearchParams(location.search).get('id'); var isEdit=!!id;
  if(isEdit) document.getElementById('heading').textContent='Edit Documentary';
  var titleEl=document.getElementById('title'), slugEl=document.getElementById('slug');
  var auto=true; titleEl.addEventListener('input', function(){ if(auto) slugEl.value=Admin.slugify(titleEl.value); }); slugEl.addEventListener('input', function(){auto=false;});
  var coverInput=document.getElementById('coverImage'), coverPreview=document.getElementById('cover-preview'), coverImg=document.getElementById('cover-img');
  coverInput.addEventListener('input', function(){ if(coverInput.value.trim()){coverImg.src=coverInput.value.trim(); coverPreview.classList.remove('hidden');}else coverPreview.classList.add('hidden'); });
  document.getElementById('file').addEventListener('change', async function(e){
    var f=e.target.files[0]; if(!f) return;
    var fd=new FormData(); fd.append('file',f);
    try{ Admin.toast('Uploading…'); var data=await Admin.request('/media/upload',{method:'POST',body:fd}); coverInput.value=data.url; coverImg.src=data.url; coverPreview.classList.remove('hidden'); Admin.toast('Uploaded'); }catch(ex){ Admin.toast(ex.message,'error'); }
  });
  if(isEdit){
    (async function(){
      try{
        var it=await Admin.request('/documentaries/'+encodeURIComponent(id));
        titleEl.value=it.title||''; slugEl.value=it.slug||''; document.getElementById('description').value=it.description||''; document.getElementById('videoUrl').value=it.videoUrl||''; if(it.coverImage){coverInput.value=it.coverImage; coverImg.src=it.coverImage; coverPreview.classList.remove('hidden');} document.getElementById('duration').value=it.duration||''; document.getElementById('status').value=it.status||'DRAFT'; document.getElementById('featured').checked=!!it.featured; document.getElementById('tags').value=(it.tags||[]).join(', '); auto=false;
      }catch(e){ Admin.toast(e.message,'error'); }
    })();
  }
  document.getElementById('form').addEventListener('submit', async function(e){
    e.preventDefault();
    var err=document.getElementById('err'), ok=document.getElementById('ok'); err.classList.add('hidden'); ok.classList.add('hidden');
    var btn=document.getElementById('btn'); btn.textContent='Saving…'; btn.disabled=true;
    var payload={
      title: titleEl.value.trim(),
      slug: slugEl.value.trim()||undefined,
      description: document.getElementById('description').value.trim()||undefined,
      videoUrl: document.getElementById('videoUrl').value.trim()||undefined,
      coverImage: coverInput.value.trim()||undefined,
      duration: document.getElementById('duration').value? parseInt(document.getElementById('duration').value,10):undefined,
      tags: document.getElementById('tags').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
      status: document.getElementById('status').value,
      featured: document.getElementById('featured').checked,
    };
    try{
      if(isEdit) await Admin.request('/documentaries/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(payload)});
      else await Admin.request('/documentaries',{method:'POST',body:JSON.stringify(payload)});
      ok.textContent=isEdit?'Updated!':'Created! Redirecting…'; ok.classList.remove('hidden');
      setTimeout(function(){ location.href='documentaries.html'; },700);
    }catch(ex){ err.textContent=ex.message; err.classList.remove('hidden'); btn.textContent='Save Documentary'; btn.disabled=false; }
  });
})();
</script>
</body>
</html>
