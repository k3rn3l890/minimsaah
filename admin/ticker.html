<div class="flex min-h-[calc(100vh-56px)]">
  <aside class="hidden md:block w-56 shrink-0 border-r border-white/5 bg-[#0A0A0A] p-4">
    <nav class="space-y-1">
      <a href="/admin/index.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Dashboard</a>
      <a href="/admin/articles.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Articles</a>
      <a href="/admin/videos.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Videos</a>
      <a href="/admin/documentaries.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Documentaries</a>
      <a href="/admin/events.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Events</a>
      <a data-nav="ticker.html" href="/admin/ticker.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase bg-white/5 text-white">Ticker</a>
      <a href="/admin/sponsors.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Sponsors</a>
      <a href="/admin/settings.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Settings</a>
      <a href="/admin/media.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Media</a>
      <a href="/admin/profile.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Profile</a>
    </nav>
  </aside>
  <main class="flex-1 p-4 md:p-6 max-w-[800px] w-full">
    <div class="md:hidden flex gap-2 mb-4 overflow-auto snap-x scrollbar-hide -mx-4 px-4">
      <a href="/admin/articles.html" class="text-xs font-mono tracking-widest border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0">Articles</a>
      <a href="/admin/videos.html" class="text-xs font-mono tracking-widest border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0">Videos</a>
      <a href="/admin/documentaries.html" class="text-xs font-mono tracking-widest border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0">Docs</a>
      <a href="/admin/events.html" class="text-xs font-mono tracking-widest border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0">Events</a>
      <a href="/admin/ticker.html" class="text-xs font-mono tracking-widest bg-white/5 text-white border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0 snap-start">Ticker</a>
      <a href="/admin/sponsors.html" class="text-xs font-mono tracking-widest border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0">Sponsors</a>
      <a href="/admin/settings.html" class="text-xs font-mono tracking-widest border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0">Settings</a>
      <a href="/admin/media.html" class="text-xs font-mono tracking-widest border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0">Media</a>
      <a href="/admin/profile.html" class="text-xs font-mono tracking-widest border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0">Profile</a>
    </div>
    <h1 class="font-['Space_Grotesk',sans-serif] text-xl md:text-2xl font-medium tracking-tight mb-2">News Ticker</h1>
    <p class="text-xs font-mono text-gray-500 mb-4">Headlines that scroll on the home page.</p>
    <form id="form" class="bg-[#0A0A0A] border border-white/5 rounded-sm p-4 flex flex-col sm:flex-row gap-2 mb-6">
      <input id="text" required placeholder="Headline text…" class="flex-1 bg-white/5 border border-white/10 rounded-sm px-3 py-3 min-h-[44px] text-sm touch-manipulation">
      <input id="priority" type="number" value="0" class="w-full sm:w-20 bg-white/5 border border-white/10 rounded-sm px-2 py-3 min-h-[44px] text-sm touch-manipulation" title="Priority">
      <button type="submit" class="bg-[#E63946] hover:bg-[#c53030] text-white text-xs font-mono tracking-widest uppercase px-4 py-3 min-h-[44px] rounded-sm touch-manipulation">Add</button>
    </form>
    <div id="list" class="space-y-2"></div>
  </main>
</div>
<script>window.__API_BASE__ = window.__API_BASE__ || 'https://minimsaah-api.onrender.com/api/v1';</script><script>window.__SUPABASE_URL = window.__SUPABASE_URL || ''; window.__SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script><script src="/assets/js/supabase-client.js"></script><script src="/admin/js/admin.js"></script>
<script>
(function(){if(typeof window.Admin==='undefined'||!Admin.requireAuth){location.href='/admin/login.html';}else{Admin.requireAuth().then(function(){document.documentElement.classList.remove('mm-guard');}).catch(function(){});}
  async function load(){
    try{
      var items=[];
      if(Admin.useSupabase()){
        var res=await Admin.supaList('tickers',{limit:50,noPager:true,orderBy:'priority',secondaryOrderBy:'created_at'});
        items=res.items;
      } else {
        items=await Admin.request('/ticker');
      }
      var el=document.getElementById('list');
      el.innerHTML='';
      if(!items.length){ el.innerHTML='<p class="text-sm text-gray-600 py-8 text-center">No ticker headlines.</p>'; return; }
      items.forEach(function(it){
        var row=document.createElement('div');
        row.className='bg-[#0A0A0A] border border-white/5 rounded-sm p-3 flex gap-3 items-center '+(it.active?'':'opacity-50');
        row.innerHTML='<div class="flex-1 min-w-0"><p class="text-sm">'+Admin.escapeHtml(it.text)+'</p><p class="text-xs font-mono text-gray-400 mt-1">Priority '+Admin.escapeHtml(String(it.priority))+' • '+(it.active?'Active':'Hidden')+'</p></div><div class="flex gap-2 shrink-0"><button data-toggle="'+Admin.escapeHtml(it.id)+'" class="text-xs font-mono border border-white/10 px-3 py-3 min-h-[44px] inline-flex items-center touch-manipulation hover:bg-white/5">'+(it.active?'Hide':'Show')+'</button><button data-del="'+Admin.escapeHtml(it.id)+'" class="text-xs font-mono border border-[#E63946]/30 text-[#E63946] px-3 py-3 min-h-[44px] inline-flex items-center touch-manipulation hover:bg-[#E63946] hover:text-white">Delete</button></div>';
        el.appendChild(row);
      });
      el.querySelectorAll('[data-toggle]').forEach(function(b){ b.onclick=async function(){ try{
        if(Admin.useSupabase()){
          var sb=Admin.supa();
          var cur=await sb.from('tickers').select('active').eq('id',b.getAttribute('data-toggle')).single();
          if(cur.error) throw new Error(cur.error.message);
          var up=await sb.from('tickers').update({active:!cur.data.active}).eq('id',b.getAttribute('data-toggle'));
          if(up.error) throw new Error(up.error.message);
          load(); return;
        }
        await Admin.request('/ticker/'+b.getAttribute('data-toggle')+'/toggle',{method:'PATCH'}); load(); }catch(e){Admin.toast(e.message,'error');} }; });
      el.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=async function(){ if(Admin.useSupabase()&&Admin.deletesDisabled()){Admin.toast('Disabled in beta');return;} if(!confirm('Delete ticker?'))return; try{ await Admin.request('/ticker/'+b.getAttribute('data-del'),{method:'DELETE'}); Admin.toast('Deleted'); load(); }catch(e){Admin.toast(e.message,'error');} }; });
    }catch(e){Admin.toast(e.message,'error');}
  }
  document.getElementById('form').addEventListener('submit', async function(e){
    e.preventDefault();
    var rawText=document.getElementById('text').value;
    var rawPri=document.getElementById('priority').value;
    // Hard input checks. Bad text or number stops the add.
    var ct=Admin.cleanField(rawText, { label:'Headline', max:200, noCode:true });
    if(!ct.ok){ Admin.toast(ct.message,'error'); return; }
    var cp=Admin.cleanField(rawPri, { label:'Priority', intRange:[-999,9999] });
    if(!cp.ok){ Admin.toast(cp.message,'error'); return; }
    var text=ct.value;
    var priority=parseInt(cp.value,10);
    if(!text) return;
    try{
      if(Admin.useSupabase()){
        var sb=Admin.supa();
        var ins=await sb.from('tickers').insert({text:text,priority:priority,active:true});
        if(ins.error) throw new Error(ins.error.message);
        document.getElementById('text').value=''; Admin.toast('Added'); load(); return;
      }
      await Admin.request('/ticker',{method:'POST', body: JSON.stringify({ text:text, priority:priority })}); document.getElementById('text').value=''; Admin.toast('Added'); load(); }catch(ex){Admin.toast(ex.message,'error');}
  });
  load();
})();
</script>
</body>
</html>
