    <h1 class="font-['Space_Grotesk',sans-serif] text-xl md:text-2xl font-medium tracking-tight mb-2">Inbox <span id="unread" class="text-xs font-mono text-[#E63946] tracking-widest"></span></h1>

<script>window.__API_BASE__ = window.__API_BASE__ || 'https://minimsaah-api.onrender.com/api/v1';</script><script>window.__SUPABASE_URL = window.__SUPABASE_URL || ''; window.__SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script><script src="/assets/js/supabase-client.js"></script><script src="/admin/js/admin.js"></script>
<script>
(function(){if(typeof window.Admin==='undefined'||!Admin.requireAuth){location.href='/admin/login.html';}else{Admin.requireAuth().then(function(){document.documentElement.classList.remove('mm-guard');}).catch(function(){});}
  function fmtDate(d){ try{ return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return d; } }
  async function load(){
    try{
      if(!Admin.useSupabase()){ Admin.toast('Supabase not configured','error'); return; }
      var sb=Admin.supa();
      var r=await sb.from('contact_messages').select('*').order('created_at',{ascending:false}).limit(100);
      if(r.error) throw new Error(r.error.message);
      var items=r.data||[];
      var unread=items.filter(function(x){return !x.is_read;}).length;
      document.getElementById('unread').textContent=unread?('('+unread+' new)'):'';
      var nav=document.getElementById('nav-unread');
      if(nav&&unread){ nav.textContent=String(unread); nav.classList.remove('hidden'); }
      var el=document.getElementById('list');
      el.innerHTML='';
      if(!items.length){ el.innerHTML='<p class="text-sm text-gray-600 py-8 text-center">No messages yet.</p>'; return; }
      items.forEach(function(it){
        var row=document.createElement('div');
        row.className='bg-[#0A0A0A] border border-white/5 rounded-sm p-3 '+(it.is_read?'':'border-l-2 border-l-[#E63946]');
        var head=document.createElement('button');
        head.className='w-full text-left flex gap-3 items-center touch-manipulation';
        head.setAttribute('aria-expanded','false');
        head.innerHTML='<div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">'+Admin.escapeHtml(it.name||'')+'</p><p class="text-xs font-mono text-gray-400 truncate">'+Admin.escapeHtml(it.email||'')+' • '+Admin.escapeHtml(fmtDate(it.created_at))+'</p></div><span class="text-[11px] font-mono '+(it.is_read?'text-gray-600':'text-[#E63946]')+' shrink-0">'+(it.is_read?'READ':'NEW')+'</span>';
        var body=document.createElement('div');
        body.className='hidden mt-3 pt-3 border-t border-white/5';
        var p=document.createElement('p');
        p.className='text-sm text-gray-200 leading-relaxed whitespace-pre-wrap break-words';
        p.textContent=it.message||'';
        body.appendChild(p);
        var btns=document.createElement('div');
        btns.className='flex gap-2 mt-3';
        if(!it.is_read){
          var rd=document.createElement('button');
          rd.className='text-xs font-mono border border-white/10 px-3 py-3 min-h-[44px] inline-flex items-center touch-manipulation hover:bg-white/5';
          rd.textContent='Mark read';
          rd.onclick=async function(ev){ ev.stopPropagation(); try{ var u=await sb.from('contact_messages').update({is_read:true}).eq('id',it.id); if(u.error) throw new Error(u.error.message); load(); }catch(e){ Admin.toast(e.message,'error'); } };
          btns.appendChild(rd);
        }
        var del=document.createElement('button');
        del.className='text-xs font-mono border border-[#E63946]/30 text-[#E63946] px-3 py-3 min-h-[44px] inline-flex items-center touch-manipulation hover:bg-[#E63946] hover:text-white';
        del.textContent='Delete';
        del.onclick=async function(ev){ ev.stopPropagation(); if(!confirm('Delete this message?'))return; try{ var d=await sb.from('contact_messages').delete().eq('id',it.id); if(d.error) throw new Error(d.error.message); load(); }catch(e){ Admin.toast(e.message,'error'); } };
        btns.appendChild(del);
        body.appendChild(btns);
        head.onclick=function(){ var open=body.classList.toggle('hidden'); head.setAttribute('aria-expanded', open?'false':'true'); };
        row.appendChild(head);
        row.appendChild(body);
        el.appendChild(row);
      });
    }catch(e){Admin.toast(e.message,'error');}
  }
  load();
})();
</script>
</body>
