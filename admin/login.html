<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MINIMSAAH Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*:focus-visible{outline:2px solid #E63946;outline-offset:2px}</style>
</head>
<body class="bg-[#050505] text-white font-['Inter',sans-serif] min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-[420px]">
  <div class="text-center mb-8">
    <a href="../index.html" class="font-['Space_Grotesk',sans-serif] text-2xl tracking-[0.25em] uppercase">MINIMSAAH</a>
    <p class="text-xs font-mono tracking-widest text-gray-500 mt-2 uppercase">Admin — Sign In</p>
  </div>
  <div class="bg-[#0A0A0A] border border-white/10 rounded-sm p-6 md:p-8">
    <form id="form" class="space-y-4">
      <div>
        <label class="text-[11px] font-mono tracking-widest text-gray-400 uppercase">Email</label>
        <input id="email" type="email" required placeholder="you@minimsaah.com" class="w-full mt-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm placeholder:text-gray-600 focus:border-[#E63946]/50 focus:outline-none">
      </div>
      <div>
        <label class="text-[11px] font-mono tracking-widest text-gray-400 uppercase">Password</label>
        <input id="password" type="password" required placeholder="••••••••" class="w-full mt-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm placeholder:text-gray-600 focus:border-[#E63946]/50 focus:outline-none">
      </div>
      <button type="submit" id="btn" class="w-full bg-[#E63946] hover:bg-[#c53030] text-white text-xs font-mono tracking-widest uppercase py-3 rounded-sm transition">Sign In</button>
      <p id="err" class="hidden text-xs text-[#E63946] bg-[#E63946]/10 border border-[#E63946]/20 rounded-sm px-3 py-2"></p>
    </form>
  </div>
  <p class="text-center text-[11px] font-mono text-gray-600 mt-4"><a href="../index.html" class="hover:text-white">← Back to site</a></p>
</div>
<script src="js/admin.js"></script>
<script>
(function(){
  var form=document.getElementById('form');
  var err=document.getElementById('err');
  var btn=document.getElementById('btn');
  // if already logged, go to admin
  if(localStorage.getItem('access_token')){
    // try me, if ok redirect
    fetch(Admin.API+'/auth/me', { headers: { 'Authorization':'Bearer '+localStorage.getItem('access_token') } }).then(function(r){
      if(r.ok) location.href='index.html';
    });
  }
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    err.classList.add('hidden');
    btn.textContent='Signing in…';
    btn.disabled=true;
    try{
      var data=await Admin.request('/auth/login', { method:'POST', body: JSON.stringify({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value }) });
      Admin.setTokens(data.accessToken, data.refreshToken);
      Admin.setUser(data.user);
      location.href='index.html';
    }catch(ex){
      err.textContent=ex.message||'Login failed';
      err.classList.remove('hidden');
      btn.textContent='Sign In';
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
