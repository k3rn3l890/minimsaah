<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MINIMSAAH Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*:focus-visible{outline:2px solid #E63946;outline-offset:2px}</style>
</head>
<body class="bg-[#050505] text-white font-['Inter',sans-serif] min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-[420px]">
  <div class="text-center mb-8">
    <a href="/index.html" class="font-['Space_Grotesk',sans-serif] text-2xl tracking-[0.25em] uppercase">MINIMSAAH</a>
    <p class="text-xs font-mono tracking-widest text-gray-500 mt-2 uppercase">Admin — Sign In</p>
  </div>
  <div class="bg-[#0A0A0A] border border-white/10 rounded-sm p-6 md:p-8">
    <form id="form" class="space-y-4">
      <div>
        <label class="text-[11px] font-mono tracking-widest text-gray-400 uppercase">Email</label>
        <input id="email" type="email" required placeholder="you@minimsaah.com" class="w-full mt-1 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm placeholder:text-gray-600 focus:border-[#E63946]/50 focus:outline-none">
      </div>
      <div>
        <label for="password" class="text-[11px] font-mono tracking-widest text-gray-400 uppercase">Password</label>
        <div class="relative mt-1">
          <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password" class="w-full bg-white/5 border border-white/10 rounded-sm pl-3 pr-12 py-2.5 text-sm placeholder:text-gray-600 focus:border-[#E63946]/50 focus:outline-none">
          <button type="button" id="pw-eye" aria-label="Show password" aria-pressed="false" class="absolute right-1 top-1/2 -translate-y-1/2 w-11 h-11 inline-flex items-center justify-center text-gray-500 hover:text-white touch-manipulation">
            <svg id="pw-eye-open" class="hidden w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="pw-eye-shut" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
          </button>
        </div>
      </div>
      <div id="mfa-box" class="hidden">
        <label class="text-[11px] font-mono tracking-widest text-gray-400 uppercase">Authenticator code</label>
        <select id="mfa-factor" class="hidden w-full mt-2 bg-[#0A0A0A] border border-white/10 rounded-sm px-3 py-3 min-h-[44px] text-sm"></select>
        <input id="mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" class="w-full mt-2 bg-white/5 border border-white/10 rounded-sm px-3 py-2.5 text-sm placeholder:text-gray-600 focus:border-[#E63946]/50 focus:outline-none">
        <p id="mfa-note" class="hidden text-xs text-gray-400 mt-2"></p>
        <div class="flex gap-2 mt-2">
          <button type="button" id="mfa-btn" class="flex-1 bg-white/5 hover:bg-white/10 border border-white/10 text-white text-xs font-mono tracking-widest uppercase py-3 rounded-sm transition">Verify Code</button>
          <button type="button" id="mfa-cancel" class="text-xs font-mono border border-white/10 px-4 py-3 uppercase hover:bg-white/5">Cancel</button>
        </div>
      </div>
      <div id="turnstile-box" class="hidden"><div id="turnstile-widget"></div></div>
      <button type="submit" id="btn" class="w-full bg-[#E63946] hover:bg-[#c53030] text-white text-xs font-mono tracking-widest uppercase py-3 rounded-sm transition">Sign In</button>
      <p id="err" class="hidden text-xs text-[#E63946] bg-[#E63946]/10 border border-[#E63946]/20 rounded-sm px-3 py-2"></p>
    </form>
  </div>
  <p class="text-center text-[11px] font-mono text-gray-600 mt-4"><a href="/index.html" class="hover:text-white">← Back to site</a></p>
</div>
<script>window.__API_BASE__ = window.__API_BASE__ || '';</script><script>window.__SUPABASE_URL = window.__SUPABASE_URL || ''; window.__SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script><script src="/assets/js/supabase-client.js"></script><script src="/admin/js/admin.js"></script>
<script>
(function(){
  var form=document.getElementById('form');
  var err=document.getElementById('err');
  var btn=document.getElementById('btn');
  function useSupa(){ return window.SupabaseDB && window.SupabaseDB.isEnabled(); }
  function mfaShow(el, on){ el.classList.toggle('hidden', !on); }
  function mfaNote(m){ var n=document.getElementById('mfa-note'); n.textContent=m||''; mfaShow(n, !!m); }
  function mfaReset(){
    mfaShow(document.getElementById('mfa-box'), false);
    mfaShow(document.getElementById('mfa-factor'), false);
    mfaNote('');
    document.getElementById('mfa-code').value = '';
    document.getElementById('mfa-btn').textContent = 'Verify Code';
  }
  // Resolves the trimmed input on Verify, null on Cancel. Re-armed per round.
  function waitCode(){
    return new Promise(function(resolve){
      document.getElementById('mfa-btn').onclick = function(){
        resolve(document.getElementById('mfa-code').value.trim());
      };
      document.getElementById('mfa-cancel').onclick = function(){ resolve(null); };
    });
  }
  // Factor picker. Single factor → its id without prompting.
  function pickFactor(factors){
    return new Promise(function(resolve){
      if (!factors.length) { resolve(null); return; }
      if (factors.length === 1) { resolve(factors[0].id); return; }
      var sel = document.getElementById('mfa-factor');
      sel.innerHTML = '';
      factors.forEach(function(f){
        var o = document.createElement('option');
        o.value = f.id;
        o.textContent = (f.friendly_name || 'Authenticator') + ' (…' + String(f.id).slice(-4) + ')';
        sel.appendChild(o);
      });
      mfaShow(document.getElementById('mfa-box'), true);
      mfaShow(sel, true);
      mfaNote('Choose which authenticator to use, then Continue.');
      document.getElementById('mfa-btn').textContent = 'Continue';
      document.getElementById('mfa-btn').onclick = function(){ resolve(sel.value || null); };
      document.getElementById('mfa-cancel').onclick = function(){ resolve(null); };
    });
  }
  async function signOutQuiet(){ try { await window.SupabaseDB.client().auth.signOut(); } catch (e) {} }
  // Best-effort audit (never blocks login; audit table may not exist yet).
  // Server door first so the row carries the caller address; direct writer as fallback.
  function audit(event, email){
    try{
      if (window.Admin && window.Admin.auditRemote) {
        window.Admin.auditRemote(event, email || '');
      } else if (window.SupabaseDB && window.SupabaseDB.isEnabled()) {
        window.SupabaseDB.client().rpc('log_admin_event', { p_event: event, p_email: email || '' }).then(null, function(){});
      }
    }catch(e){}
  }
  // Turnstile CAPTCHA: only active when a site key is configured
  // (window.__TURNSTILE_SITEKEY via Vercel env + inject). Unconfigured = skipped.
  var TURNSTILE_KEY = window.__TURNSTILE_SITEKEY || '';
  if (TURNSTILE_KEY) {
    var ts = document.createElement('script');
    ts.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    ts.async = true; ts.defer = true;
    ts.onerror = function(){ TURNSTILE_KEY = ''; };
    ts.onload = function(){
      try { window.turnstile.render('#turnstile-widget', { sitekey: TURNSTILE_KEY }); }
      catch (e) { TURNSTILE_KEY = ''; }
    };
    document.head.appendChild(ts);
    document.getElementById('turnstile-box').classList.remove('hidden');
  }
  // if already logged, go to admin (staff only — others are signed out)
  if (useSupa()) {
    window.SupabaseDB.client().auth.getSession().then(function(r){
      var sess = r.data && r.data.session;
      if (!sess) return;
      window.SupabaseDB.client().auth.getUser().then(function(ur){
        var u = ur.data && ur.data.user;
        var role = u && u.user_metadata && u.user_metadata.role;
        var ok = (Admin.isStaffRole ? Admin.isStaffRole(role) : (['OWNER','EDITOR','JOURNALIST','VIDEOGRAPHER'].indexOf(role) !== -1));
        if (!ok) { window.SupabaseDB.client().auth.signOut(); return; }
        // Don't auto-enter on a half-stepped-up session: an aal1 session
        // with enrolled factors must complete MFA via a fresh login.
        var sb0 = window.SupabaseDB.client();
        function go(){ location.href='/admin/index.html'; }
        try {
          if (sb0.auth.mfa && sb0.auth.mfa.getAuthenticatorAssuranceLevel) {
            sb0.auth.mfa.getAuthenticatorAssuranceLevel().then(function(lr){
              var lv = lr.data || {};
              if (lv.nextLevel === 'aal2' && lv.currentLevel !== 'aal2') { sb0.auth.signOut(); return; }
              go();
            }, function(){ go(); });
          } else go();
        } catch (e) { go(); }
      });
    });
  } else if(localStorage.getItem('access_token')){
    // try me, if ok redirect (localhost Nest fallback)
    fetch(Admin.API+'/auth/me', { headers: { 'Authorization':'Bearer '+localStorage.getItem('access_token') } }).then(function(r){
      if(r.ok) location.href='/admin/index.html';
    });
  }
  // Show/hide password eye. Keeps focus in the box. Screen reader told.
  (function(){
    var box=document.getElementById('password'), eye=document.getElementById('pw-eye');
    if(!box||!eye) return;
    eye.addEventListener('click', function(){
      var showIt=box.type==='password';
      box.type=showIt?'text':'password';
      eye.setAttribute('aria-label', showIt?'Hide password':'Show password');
      eye.setAttribute('aria-pressed', showIt?'true':'false');
      document.getElementById('pw-eye-open').classList.toggle('hidden', !showIt);
      document.getElementById('pw-eye-shut').classList.toggle('hidden', showIt);
      eye.classList.toggle('text-[#E63946]', showIt);
      try{ box.focus(); }catch(e){}
    });
  })();
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    err.classList.add('hidden');
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    // Hard email shape check first. Password is never altered, only sent.
    try{
      if (window.Admin && window.Admin.cleanField) {
        var ec = window.Admin.cleanField(email, { label: 'Email', max: 320, email: true });
        if (!ec.ok) { err.textContent = ec.message; err.classList.remove('hidden'); return; }
        email = ec.value;
      }
    }catch(ce){}
    // Soft try limit (code only, no server change).
    // 3 fails -> wait 30 sec. 5 fails in 15 min -> wait 15 min. Friendly, not hard block.
    function tryKey(em){ return 'ms_login_tries_' + String(em||'').toLowerCase(); }
    function getTries(em){
      try { return JSON.parse(localStorage.getItem(tryKey(em)) || '{"count":0,"firstTime":0,"lockUntil":0}'); }
      catch (ex) { return { count: 0, firstTime: 0, lockUntil: 0 }; }
    }
    function setTries(em, t){ try { localStorage.setItem(tryKey(em), JSON.stringify(t)); } catch (ex) {} }
    function clearTries(em){ try { localStorage.removeItem(tryKey(em)); } catch (ex) {} }
    function waitText(ms){
      var s = Math.ceil(ms / 1000);
      if (s >= 60) return Math.ceil(s / 60) + ' minute(s)';
      return s + ' second(s)';
    }
    var now = Date.now();
    var st = getTries(email);
    if (st.firstTime && (now - st.firstTime) > 15 * 60 * 1000) { st = { count: 0, firstTime: 0, lockUntil: 0 }; setTries(email, st); }
    if (st.lockUntil && now < st.lockUntil) {
      err.textContent = 'Too many tries. Wait ' + waitText(st.lockUntil - now) + '.';
      err.classList.remove('hidden');
      return;
    }
    function recordFail(em){
      var t = Date.now();
      var s = getTries(em);
      if (!s.firstTime || (t - s.firstTime) > 15 * 60 * 1000) s = { count: 0, firstTime: t, lockUntil: 0 };
      s.count = (s.count || 0) + 1;
      if (s.count >= 5) s.lockUntil = t + 15 * 60 * 1000;
      else if (s.count >= 3) s.lockUntil = t + 30 * 1000;
      setTries(em, s);
      return s;
    }
    btn.textContent='Signing in…';
    btn.disabled=true;
    try{
      if (useSupa()) {
        var sb = window.SupabaseDB.client();
        var captchaToken = '';
        if (TURNSTILE_KEY && window.turnstile) {
          try { captchaToken = window.turnstile.getResponse() || ''; } catch (e) { captchaToken = ''; }
          if (!captchaToken) throw new Error('Please complete the captcha');
        }
        var res = await sb.auth.signInWithPassword({ email: email, password: password, options: { captchaToken: captchaToken || undefined } });
        if (res.error) { audit('login_failed', email); throw new Error(res.error.message); }
        // MFA: staff with enrolled factors complete a TOTP challenge.
        // Zero enrolled factors → skipped (no lockout during rollout).
        var factors = [];
        try {
          if (sb.auth.mfa && sb.auth.mfa.listFactors) {
            var lf = await sb.auth.mfa.listFactors();
            factors = (lf.data && (lf.data.totp || [])) || [];
          }
        } catch (e) { factors = []; }
        if (factors.length) {
          // Already stepped up (e.g. restored aal2 session) → skip challenge.
          var steppedUp = false;
          try {
            if (sb.auth.mfa.getAuthenticatorAssuranceLevel) {
              var lv0 = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
              steppedUp = !!(lv0.data && lv0.data.currentLevel === 'aal2');
            }
          } catch (e) {}
          if (!steppedUp) {
            var fid = await pickFactor(factors);
            if (!fid) { await signOutQuiet(); mfaReset(); throw new Error('Sign-in cancelled'); }
            mfaShow(document.getElementById('mfa-box'), true);
            mfaShow(document.getElementById('mfa-factor'), false);
            document.getElementById('mfa-btn').textContent = 'Verify Code';
            var verified = false, attempts = 0;
            while (!verified && attempts < 3) {
              attempts++;
              var ch = await sb.auth.mfa.challenge({ factorId: fid });
              if (ch.error) throw new Error(ch.error.message);
              var code = await waitCode();
              if (code === null) { await signOutQuiet(); mfaReset(); throw new Error('Sign-in cancelled'); }
              if (!code) { mfaNote('Enter the 6-digit code'); continue; }
              if (!/^\d{6,8}$/.test(code)) { mfaNote('Code must be digits only'); continue; }
              var vr = await sb.auth.mfa.verify({ factorId: fid, challengeId: ch.data.id, code: code });
              if (!vr.error) { verified = true; break; }
              mfaNote('Code rejected (' + attempts + '/3) — check your app clock and retry');
            }
            mfaShow(document.getElementById('mfa-box'), false);
            if (!verified) { await signOutQuiet(); audit('login_failed', email); throw new Error('Verification failed'); }
          }
        }
        var gu = await sb.auth.getUser();
        var u = (gu.data && gu.data.user) || res.data.user;
        var role = (u.user_metadata&&u.user_metadata.role)||'SUBSCRIBER';
        var allowed = (Admin.isStaffRole ? Admin.isStaffRole(role) : (['OWNER','EDITOR','JOURNALIST','VIDEOGRAPHER'].indexOf(role) !== -1));
        if (!allowed) {
          try { await sb.auth.signOut(); } catch (e) {}
          audit('login_denied', email);
          throw new Error('Access denied — staff only');
        }
        var fn = (u.user_metadata&&u.user_metadata.firstName)||'';
        var ln = (u.user_metadata&&u.user_metadata.lastName)||'';
        // True name lives in the users table (profile page writes it there).
        // Login metadata can be stale, so prefer the table row. Fall back
        // to metadata so login never breaks if the row read fails.
        try {
          var prow = await sb.from('users').select('first_name,last_name').eq('id', u.id).single();
          if (prow && !prow.error && prow.data) {
            if (prow.data.first_name) fn = prow.data.first_name;
            if (prow.data.last_name) ln = prow.data.last_name;
          }
        } catch (e) {}
        Admin.setUser({ id: u.id, email: u.email, firstName: fn, lastName: ln, role: role });
        clearTries(email);
        location.href='/admin/index.html';
        return;
      }
      var data=await Admin.request('/auth/login', { method:'POST', body: JSON.stringify({ email: email, password: password }) });
      Admin.setTokens(data.accessToken, data.refreshToken);
      Admin.setUser(data.user);
      clearTries(email);
      location.href='/admin/index.html';
    }catch(ex){
      try { mfaReset(); } catch (e) {}
      var fs = recordFail(email);
      var extra = '';
      if (fs.lockUntil && Date.now() < fs.lockUntil) extra = ' Wait ' + waitText(fs.lockUntil - Date.now()) + '.';
      err.textContent=(ex.message||'Login failed') + extra;
      err.classList.remove('hidden');
      btn.textContent='Sign In';
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
