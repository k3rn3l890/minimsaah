<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos — MINIMSAAH Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*:focus-visible{outline:2px solid #E63946;outline-offset:2px}</style>
</head>
<body class="bg-[#050505] text-white font-['Inter',sans-serif] min-h-screen">
<nav class="sticky top-0 z-40 bg-[#050505]/90 backdrop-blur-md border-b border-white/5 px-4 md:px-6 py-3 flex items-center justify-between">
  <a href="../index.html" class="font-['Space_Grotesk',sans-serif] text-lg tracking-[0.2em] uppercase">MINIMSAAH</a>
  <div class="flex gap-2">
    <a href="video-form.html" class="bg-[#E63946] hover:bg-[#c53030] text-white text-[11px] font-mono tracking-widest uppercase px-4 py-2 rounded-sm">+ New Video</a>
    <button onclick="Admin.logout()" class="text-[11px] font-mono border border-white/10 px-3 py-2 uppercase">Logout</button>
  </div>
</nav>
<div class="flex min-h-[calc(100vh-56px)]">
  <aside class="hidden md:block w-56 shrink-0 border-r border-white/5 bg-[#0A0A0A] p-4">
    <nav class="space-y-1">
      <a href="index.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Dashboard</a>
      <a href="articles.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Articles</a>
      <a data-nav="videos.html" href="videos.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase bg-white/5 text-white">Videos</a>
      <a href="documentaries.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Documentaries</a>
      <a href="events.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Events</a>
      <a href="ticker.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Ticker</a>
      <a href="media.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Media</a>
    </nav>
    <div class="mt-6 bg-[#E63946]/10 border border-[#E63946]/20 rounded-sm p-3">
      <p class="text-[11px] font-mono tracking-widest text-[#E63946] uppercase">No redirect</p>
      <p class="text-xs text-gray-400 mt-1 leading-relaxed">All 4 platforms play inside your site. Thumbnail shows, user stays.</p>
    </div>
  </aside>
  <main class="flex-1 p-4 md:p-6 max-w-[1100px] w-full">
    <div class="md:hidden flex gap-2 mb-4 overflow-auto snap-x scrollbar-hide -mx-4 px-4">
      <a href="articles.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Articles</a>
      <a href="videos.html" class="text-[11px] font-mono tracking-widest bg-white/5 text-white border border-white/10 px-3.5 py-2 uppercase shrink-0">Videos</a>
      <a href="documentaries.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Docs</a>
      <a href="events.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Events</a>
      <a href="ticker.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Ticker</a>
      <a href="media.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Media</a>
    </div>
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">
      <h1 class="font-['Space_Grotesk',sans-serif] text-xl md:text-2xl font-medium tracking-tight">Video Stories</h1>
      <select id="status" class="bg-[#0A0A0A] border border-white/10 rounded-sm px-2 py-3 sm:py-2 text-xs touch-manipulation"><option value="">All</option><option value="PUBLISHED">Published</option><option value="DRAFT">Draft</option></select>
    </div>
    <div id="list" class="space-y-2"></div>
    <div id="pager" class="flex justify-between items-center mt-4 text-xs font-mono text-gray-500"></div>
  </main>
</div>
<script src="js/admin.js"></script>
<script>
(function(){
  Admin.requireAuth();
  var page=1,limit=10;
  async function load(){
    try{
      var path='/videos?page='+page+'&limit='+limit;
      var s=document.getElementById('status').value;
      if(s) path+='&status='+s;
      var data=await Admin.request(path);
      var items=data.items||[];
      var el=document.getElementById('list');
      el.innerHTML='';
      if(!items.length){ el.innerHTML='<p class="text-sm text-gray-600 py-8 text-center">No videos. Paste YouTube/TikTok/Facebook/Instagram link to add one.</p>'; document.getElementById('pager').innerHTML=''; return; }
      items.forEach(function(it){
        var t=it.thumbnail||it.coverImage||'';
        if(!t && it.videoUrl && it.videoUrl.indexOf('youtube')!==-1){
          var m=it.videoUrl.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
          if(m) t='https://img.youtube.com/vi/'+m[1]+'/hqdefault.jpg';
        }
        var row=document.createElement('div');
        row.className='bg-[#0A0A0A] border border-white/5 rounded-sm p-3 flex gap-3 items-center flex-wrap sm:flex-nowrap';
        row.innerHTML='<div class="w-24 h-14 bg-[#111] rounded-sm shrink-0 overflow-hidden relative">'+(t? '<img src="'+t+'" class="w-full h-full object-cover">':'<div class="w-full h-full flex items-center justify-center text-[10px] font-mono text-gray-600">NO THUMB</div>')+'<div class="absolute inset-0 flex items-center justify-center"><div class="w-6 h-6 rounded-full bg-[#E63946]/90 flex items-center justify-center"><svg class="w-3 h-3 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div></div><div class="flex-1 min-w-0"><a href="video-form.html?id='+encodeURIComponent(it.id)+'" class="text-sm font-medium hover:text-[#E63946] line-clamp-1">'+it.title+'</a><div class="text-[11px] font-mono text-gray-500 mt-1 truncate"><span class="'+(it.status==='PUBLISHED'?'text-green-400':'text-yellow-500')+'">'+it.status+'</span> • '+(it.videoUrl||'').slice(0,40)+' • '+Admin.fmtDate(it.publishedAt||it.createdAt)+' • <a href="../video.html?slug='+encodeURIComponent(it.slug)+'" target="_blank" class="underline hover:text-white">View →</a></div></div><div class="flex gap-1 shrink-0 w-full sm:w-auto justify-end"><a href="video-form.html?id='+encodeURIComponent(it.id)+'" class="text-[11px] font-mono border border-white/10 px-3 py-2 hover:border-white/20 touch-manipulation active:bg-white/5">Edit</a><button data-del="'+it.id+'" class="text-[11px] font-mono border border-[#E63946]/30 text-[#E63946] px-3 py-2 hover:bg-[#E63946] hover:text-white touch-manipulation active:bg-[#E63946]">Delete</button></div>';
        el.appendChild(row);
      });
      el.querySelectorAll('[data-del]').forEach(function(b){
        b.onclick=async function(){ if(!confirm('Delete video?')) return; try{ await Admin.request('/videos/'+b.getAttribute('data-del'),{method:'DELETE'}); Admin.toast('Deleted'); load(); }catch(e){Admin.toast(e.message,'error');} };
      });
      var meta=data.meta||{}; var pager=document.getElementById('pager');
      pager.innerHTML='<span>'+(meta.total||items.length)+' total • page '+page+'/'+(meta.totalPages||1)+'</span><div class="flex gap-2"><button id="prev" class="border border-white/10 px-3.5 py-2 hover:bg-white/5 disabled:opacity-30 touch-manipulation">Prev</button><button id="next" class="border border-white/10 px-3.5 py-2 hover:bg-white/5 disabled:opacity-30 touch-manipulation">Next</button></div>';
      document.getElementById('prev').disabled=page<=1; document.getElementById('next').disabled=page>=(meta.totalPages||1);
      document.getElementById('prev').onclick=function(){ if(page>1){page--; load();}};
      document.getElementById('next').onclick=function(){ if(page<(meta.totalPages||1)){page++; load();}};
    }catch(e){ Admin.toast(e.message,'error'); }
  }
  document.getElementById('status').addEventListener('change', function(){page=1; load();});
  load();
})();
</script>
</body>
</html>
