    <a href="/admin/article-form.html" class="bg-[#E63946] hover:bg-[#c53030] text-white text-[11px] font-mono tracking-widest uppercase px-4 py-2 rounded-sm">+ New Article</a>

<div class="flex min-h-[calc(100vh-56px)]">
  <aside class="hidden md:block w-56 shrink-0 border-r border-white/5 bg-[#0A0A0A] p-4">
    <nav class="space-y-1">
      <a href="/admin/index.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Dashboard</a>
      <a data-nav="articles.html" href="/admin/articles.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase bg-white/5 text-white">Articles</a>
      <a href="/admin/videos.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Videos</a>
      <a href="/admin/documentaries.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Documentaries</a>
      <a href="/admin/events.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Events</a>
      <a href="/admin/ticker.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Ticker</a>
      <a href="/admin/sponsors.html" class="flex items-center gap-2 px-3 py-2 rounded-sm text-xs font-mono tracking-widest uppercase text-gray-400 hover:bg-white/5 hover:text-white">Sponsors</a>

    </nav>
  </aside>
  <main class="flex-1 p-4 md:p-6 max-w-[1100px] w-full">
    <div class="md:hidden flex gap-2 mb-4 overflow-auto snap-x scrollbar-hide -mx-4 px-4">
      <a href="/admin/articles.html" class="text-[11px] font-mono tracking-widest bg-white/5 text-white border border-white/10 px-3.5 py-2 uppercase shrink-0">Articles</a>
      <a href="/admin/videos.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Videos</a>
      <a href="/admin/documentaries.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Docs</a>
      <a href="/admin/events.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Events</a>
      <a href="/admin/ticker.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Ticker</a>
      <a href="/admin/sponsors.html" class="text-xs font-mono tracking-widest border border-white/10 px-3.5 py-3 min-h-[44px] inline-flex items-center touch-manipulation uppercase shrink-0">Sponsors</a>
      <a href="/admin/media.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Media</a>
      <a href="/admin/profile.html" class="text-[11px] font-mono tracking-widest border border-white/10 px-3.5 py-2 uppercase shrink-0">Profile</a>
    </div>
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
      <h1 class="font-['Space_Grotesk',sans-serif] text-xl md:text-2xl font-medium tracking-tight">Articles</h1>
      <div class="flex gap-2">
        <input id="search" placeholder="Search title…" class="bg-white/5 border border-white/10 rounded-sm px-3 py-3 sm:py-2 text-xs flex-1 sm:w-48 placeholder:text-gray-600 focus:border-[#E63946]/50 focus:outline-none">
        <select id="status" class="bg-[#0A0A0A] border border-white/10 rounded-sm px-2 py-3 sm:py-2 text-xs touch-manipulation">
          <option value="">All status</option><option value="PUBLISHED">Published</option><option value="DRAFT">Draft</option><option value="REVIEW">Review</option><option value="ARCHIVED">Archived</option>
        </select>
      </div>
    </div>
    <div id="list" class="space-y-2"></div>
    <div id="pager" class="flex justify-between items-center mt-4 text-xs font-mono text-gray-500"></div>
  </main>
</div>
<script>window.__API_BASE__ = window.__API_BASE__ || 'https://minimsaah-api.onrender.com/api/v1';</script><script>window.__SUPABASE_URL = window.__SUPABASE_URL || ''; window.__SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script><script src="/assets/js/supabase-client.js"></script><script src="/admin/js/admin.js"></script>
<script>
(function(){
  if(typeof window.Admin==='undefined'||!Admin.requireAuth){location.href='/admin/login.html';}else{Admin.requireAuth().then(function(){document.documentElement.classList.remove('mm-guard');}).catch(function(){});}
  var page=1, limit=10;
  var searchEl=document.getElementById('search');
  var statusEl=document.getElementById('status');
  function q(){
    var p='?page='+page+'&limit='+limit;
    if(searchEl.value.trim()) p+='&search='+encodeURIComponent(searchEl.value.trim());
    if(statusEl.value) p+='&status='+statusEl.value;
    return p;
  }
  async function load(){
    try{
      var items=[], meta={total:0,page:page,limit:limit,totalPages:1};
      if(Admin.useSupabase()){
        var res=await Admin.supaList('articles',{status:statusEl.value||undefined,search:searchEl.value.trim()||undefined,searchFields:['title','excerpt','body'],orderBy:'published_at',page:page,limit:limit});
        items=res.items; meta=res.meta;
      } else {
        var data=await Admin.request('/articles'+q());
        items=data.items||[]; meta=data.meta||meta;
      }
      var el=document.getElementById('list');
      el.innerHTML='';
      if(!items.length){ el.innerHTML='<p class="text-sm text-gray-600 py-8 text-center">No articles.</p>'; document.getElementById('pager').innerHTML=''; return; }
      items.forEach(function(it){
        var row=document.createElement('div');
        row.className='bg-[#0A0A0A] border border-white/5 rounded-sm p-3 md:p-4 flex gap-3 items-center flex-wrap sm:flex-nowrap';
        var cover=it.coverImage? '<img src="'+Admin.escapeHtml(it.coverImage)+'" class="w-20 h-14 object-cover rounded-sm shrink-0 bg-[#111]" alt="">' : '<div class="w-20 h-14 bg-[#111] rounded-sm shrink-0 flex items-center justify-center text-[10px] font-mono text-gray-600">NO IMG</div>';
        row.innerHTML=cover+'<div class="flex-1 min-w-0"><a href="/admin/article-form.html?id='+encodeURIComponent(it.id)+'" class="text-sm font-medium hover:text-[#E63946] line-clamp-1">'+Admin.escapeHtml(it.title)+'</a><div class="text-[11px] font-mono text-gray-500 mt-1 flex gap-2 flex-wrap"><span class="'+(it.status==='PUBLISHED'?'text-green-400':'text-yellow-500')+'">'+Admin.escapeHtml(it.status)+'</span><span>•</span><span>'+Admin.escapeHtml((it.category||'').replace(/_/g,' '))+'</span><span>•</span><span>'+Admin.fmtDate(it.publishedAt||it.createdAt)+'</span><span>•</span><a href="/article/'+encodeURIComponent(it.slug)+'" target="_blank" class="hover:text-white underline">View →</a></div></div><div class="flex gap-1 shrink-0 w-full sm:w-auto justify-end"><a href="/admin/article-form.html?id='+encodeURIComponent(it.id)+'" class="text-[11px] font-mono border border-white/10 px-3 py-2 hover:border-white/20 touch-manipulation active:bg-white/5">Edit</a><button data-del="'+Admin.escapeHtml(it.id)+'" class="text-[11px] font-mono border border-[#E63946]/30 text-[#E63946] px-3 py-2 hover:bg-[#E63946] hover:text-white touch-manipulation active:bg-[#E63946]">Delete</button></div>';
        el.appendChild(row);
      });
      el.querySelectorAll('[data-del]').forEach(function(b){
        b.onclick=async function(){
          if(Admin.useSupabase()&&Admin.deletesDisabled()){ Admin.toast('Disabled in beta'); return; }
          if(!confirm('Delete this article?')) return;
          try{ await Admin.request('/articles/'+b.getAttribute('data-del'),{method:'DELETE'}); Admin.toast('Deleted'); load(); }catch(e){ Admin.toast(e.message,'error'); }
        };
      });
      var pager=document.getElementById('pager');
      pager.innerHTML='<span>'+(meta.total||items.length)+' total • page '+page+'/'+(meta.totalPages||1)+'</span><div class="flex gap-2"><button id="prev" class="border border-white/10 px-3.5 py-2 hover:bg-white/5 disabled:opacity-30 touch-manipulation">Prev</button><button id="next" class="border border-white/10 px-3.5 py-2 hover:bg-white/5 disabled:opacity-30 touch-manipulation">Next</button></div>';
      document.getElementById('prev').disabled=page<=1;
      document.getElementById('next').disabled=page>=(meta.totalPages||1);
      document.getElementById('prev').onclick=function(){ if(page>1){page--; load();} };
      document.getElementById('next').onclick=function(){ if(page<(meta.totalPages||1)){page++; load();} };
    }catch(e){ Admin.toast(e.message,'error'); }
  }
  var t; searchEl.addEventListener('input', function(){ clearTimeout(t); t=setTimeout(function(){page=1; load();},400); });
  statusEl.addEventListener('change', function(){page=1; load();});
  load();
})();
</script>
</body>
</html>
