<script>window.__API_BASE__ = window.__API_BASE__ || 'https://minimsaah-api.onrender.com/api/v1';</script><script>window.__SUPABASE_URL = window.__SUPABASE_URL || ''; window.__SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script><script src="/assets/js/supabase-client.js"></script><script src="/admin/js/admin.js"></script>
<script>
(function(){if(typeof window.Admin==='undefined'||!Admin.requireAuth){location.href='/admin/login.html';}else{Admin.requireAuth().then(function(){document.documentElement.classList.remove('mm-guard');}).catch(function(){});}
  async function load(){
    try{
      var items=[];
      if(Admin.useSupabase()){
        var res=await Admin.supaList('events',{limit:20,noPager:true,orderBy:'date',asc:true});
        items=res.items;
      } else {
        var data=await Admin.request('/events?limit=20');
        items=data.items||[];
      }
      var el=document.getElementById('list');
      el.innerHTML='';
      if(!items.length){ el.innerHTML='<p class="text-sm text-gray-600 py-8 text-center">No events.</p>'; return; }
      items.forEach(function(it){
        var d=new Date(it.date);
        var row=document.createElement('div');
        row.className='bg-[#0A0A0A] border border-white/5 rounded-sm p-3 flex gap-3 items-center flex-wrap sm:flex-nowrap';
        row.innerHTML='<div class="w-14 h-14 bg-[#111] border border-white/5 rounded-sm flex flex-col items-center justify-center shrink-0"><span class="text-lg font-medium text-[#E63946] leading-none">'+d.getDate()+'</span><span class="text-xs font-mono tracking-widest text-gray-400">'+d.toLocaleDateString('en-US',{month:'short'}).toUpperCase()+'</span></div><div class="flex-1 min-w-0"><a href="/admin/event-form.html?id='+encodeURIComponent(it.id)+'" class="text-sm font-medium hover:text-[#E63946] line-clamp-1">'+Admin.escapeHtml(it.title)+'</a><div class="text-xs font-mono text-gray-400 mt-1"><span class="'+(it.status==='PUBLISHED'?'text-green-400':'text-yellow-500')+'">'+Admin.escapeHtml(it.status)+'</span> • '+Admin.escapeHtml(it.location||it.venue||'')+' • '+Admin.fmtDate(it.date)+' • <a href="/event/'+encodeURIComponent(it.slug)+'" target="_blank" class="underline hover:text-white">View →</a></div></div><div class="flex gap-2 shrink-0 w-full sm:w-auto justify-end"><a href="/admin/event-form.html?id='+encodeURIComponent(it.id)+'" class="text-xs font-mono border border-white/10 px-3 py-3 min-h-[44px] inline-flex items-center touch-manipulation hover:border-white/20">Edit</a><button data-del="'+Admin.escapeHtml(it.id)+'" class="text-xs font-mono border border-[#E63946]/30 text-[#E63946] px-3 py-3 min-h-[44px] inline-flex items-center touch-manipulation hover:bg-[#E63946] hover:text-white">Delete</button></div>';
        el.appendChild(row);
      });
      el.querySelectorAll('[data-del]').forEach(function(b){b.onclick=async function(){if(Admin.useSupabase()&&Admin.deletesDisabled()){Admin.toast('Disabled in beta');return;}if(!confirm('Delete event?'))return;try{await Admin.request('/events/'+b.getAttribute('data-del'),{method:'DELETE'});Admin.toast('Deleted');load();}catch(e){Admin.toast(e.message,'error');}};});
    }catch(e){Admin.toast(e.message,'error');}
  }
  load();
})();
</script>
